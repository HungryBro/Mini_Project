[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

# Reads the Option A legacy-compatible JSON after Kafka Connect copies it
# from VerneMQ.
[[inputs.kafka_consumer]]
  brokers = ["kafka:29092"]
  topics = ["${KAFKA_TOPIC}"]
  consumer_group = "${KAFKA_CONSUMER_GROUP}"
  offset = "oldest"
  max_undelivered_messages = 1000
  data_format = "json_v2"

  [[inputs.kafka_consumer.json_v2]]
    measurement_name = "traffic_summary"
    timestamp_path = "payload.timestamp"
    timestamp_format = "unix"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "id"
      rename = "id"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "name"
      rename = "name"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "place_id"
      rename = "place_id"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "payload.lane_1_direction"
      rename = "lane_1_direction"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "payload.lane_2_direction"
      rename = "lane_2_direction"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "payload.lane_3_direction"
      rename = "lane_3_direction"

    [[inputs.kafka_consumer.json_v2.tag]]
      path = "payload.lane_4_direction"
      rename = "lane_4_direction"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.vehicle_count"
      rename = "vehicle_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.wrong_way_count"
      rename = "wrong_way_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.wrong_way_rate_per_100_vehicles"
      rename = "wrong_way_rate_per_100_vehicles"
      type = "float"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.window_seconds"
      rename = "window_seconds"
      type = "float"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.complete_window"
      rename = "complete_window"
      type = "bool"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_1_vehicle_count"
      rename = "lane_1_vehicle_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_1_wrong_way_count"
      rename = "lane_1_wrong_way_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_1_wrong_way_rate_per_100"
      rename = "lane_1_wrong_way_rate_per_100"
      type = "float"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_2_vehicle_count"
      rename = "lane_2_vehicle_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_2_wrong_way_count"
      rename = "lane_2_wrong_way_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_2_wrong_way_rate_per_100"
      rename = "lane_2_wrong_way_rate_per_100"
      type = "float"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_3_vehicle_count"
      rename = "lane_3_vehicle_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_3_wrong_way_count"
      rename = "lane_3_wrong_way_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_3_wrong_way_rate_per_100"
      rename = "lane_3_wrong_way_rate_per_100"
      type = "float"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_4_vehicle_count"
      rename = "lane_4_vehicle_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_4_wrong_way_count"
      rename = "lane_4_wrong_way_count"
      type = "int"

    [[inputs.kafka_consumer.json_v2.field]]
      path = "payload.lane_4_wrong_way_rate_per_100"
      rename = "lane_4_wrong_way_rate_per_100"
      type = "float"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN:?Set INFLUX_TOKEN in .env}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
