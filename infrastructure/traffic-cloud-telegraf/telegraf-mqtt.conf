[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

# Dedicated cloud service: VerneMQ -> InfluxDB, independent of Kafka.
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["${MQTT_TOPIC}"]
  qos = ${MQTT_QOS}
  client_id = "${MQTT_CLIENT_ID}"
  persistent_session = true
  connection_timeout = "30s"
  topic_tag = ""
  max_undelivered_messages = 1000
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    # One measurement per student. ``field_id`` remains available as a tag
    # for filtering in Grafana and Data Explorer.
    measurement_name = "traffic_6610301004"
    timestamp_path = "timestamp"
    timestamp_format = "unix"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "field_id"
      rename = "field_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "place_id"
      rename = "place_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "payload.lane_1_direction"
      rename = "lane_1_direction"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "payload.lane_2_direction"
      rename = "lane_2_direction"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "payload.lane_3_direction"
      rename = "lane_3_direction"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "payload.lane_4_direction"
      rename = "lane_4_direction"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.vehicle_count"
      rename = "vehicle_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.wrong_way_count"
      rename = "wrong_way_count"
      type = "int"

    # Lane direction text remains an Influx tag above for filtering.  These
    # numeric values are fields so Grafana can plot the active lane plan:
    # up=1, down=0. V2 always resolves direction from its timetable.
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_1_direction_value"
      rename = "lane_1_direction_value"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_2_direction_value"
      rename = "lane_2_direction_value"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_3_direction_value"
      rename = "lane_3_direction_value"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_4_direction_value"
      rename = "lane_4_direction_value"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_1_vehicle_count"
      rename = "lane_1_vehicle_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_1_wrong_way_count"
      rename = "lane_1_wrong_way_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_1_wrong_way_rate_per_100"
      rename = "lane_1_wrong_way_rate_per_100"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_2_vehicle_count"
      rename = "lane_2_vehicle_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_2_wrong_way_count"
      rename = "lane_2_wrong_way_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_2_wrong_way_rate_per_100"
      rename = "lane_2_wrong_way_rate_per_100"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_3_vehicle_count"
      rename = "lane_3_vehicle_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_3_wrong_way_count"
      rename = "lane_3_wrong_way_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_3_wrong_way_rate_per_100"
      rename = "lane_3_wrong_way_rate_per_100"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_4_vehicle_count"
      rename = "lane_4_vehicle_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_4_wrong_way_count"
      rename = "lane_4_wrong_way_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "payload.lane_4_wrong_way_rate_per_100"
      rename = "lane_4_wrong_way_rate_per_100"
      type = "float"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
