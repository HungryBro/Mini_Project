[agent]
  interval = "10s"
  flush_interval = "10s"
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  omit_hostname = true

# Receives only the final traffic summaries published by payload/mqtt/gateway.py.
[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_BROKER}:${MQTT_PORT}"]
  topics = ["${MQTT_TOPIC}"]
  qos = ${MQTT_QOS}
  connection_timeout = "30s"
  client_id = "${TELEGRAF_CLIENT_ID}"
  persistent_session = true
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "traffic_summary"
    timestamp_path = "timestamp"
    timestamp_format = "2006-01-02T15:04:05Z07:00"

    # Low-cardinality tags identify the camera and the active lane arrangement.
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "location.site_id"
      rename = "site_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "location.site_name"
      rename = "site_name"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "location.camera_id"
      rename = "camera_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "camera_profile"
      rename = "camera_profile"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "lanes.lane_1.direction"
      rename = "lane_1_direction"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "lanes.lane_2.direction"
      rename = "lane_2_direction"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "lanes.lane_3.direction"
      rename = "lane_3_direction"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "lanes.lane_4.direction"
      rename = "lane_4_direction"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "traffic.vehicle_count"
      rename = "vehicle_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "wrong_way.count"
      rename = "wrong_way_count"
      type = "int"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "wrong_way.rate_per_100_vehicles"
      rename = "wrong_way_rate_per_100_vehicles"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "window.seconds"
      rename = "window_seconds"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "window.complete_window"
      rename = "complete_window"
      type = "bool"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN:?Set INFLUX_TOKEN in .env}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
